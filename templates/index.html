<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guss AI, tu asistente inteligente.">
    <title>Guss AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>

<body>
    <div class="chat-container">

        <header class="chat-header">
            <div>
                <h1>Guss AI</h1>
                <p>Tu asistente inteligente</p>
            </div>
            <button type="button" id="new-chat-btn" class="new-chat-btn">
                Nueva conversación
            </button>
        </header>

        <main id="chat-box" class="chat-box" aria-live="polite" aria-label="Conversación">
            <div class="message guss-message">
                ¡Hola! Soy Guss. ¿En qué te puedo ayudar hoy?
            </div>
        </main>


        <div class="input-area">
            <label for="user-input" class="sr-only">Mensaje</label>
            <textarea
                id="user-input"
                rows="1"
                maxlength="4000"
                placeholder="Escribe tu mensaje aquí... (Enter envía, Shift+Enter salta de línea)"
                autocomplete="off"
            ></textarea>
            <button type="button" id="send-btn">Enviar</button>
        </div>

    </div>
</body>
</html>
